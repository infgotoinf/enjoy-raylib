name: Build Project - Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_windows.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}

    steps:
    - name: Checkout this repo
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}

    - name: Setup Environment
      uses: msys2/setup-msys2@master
      with:
        mysystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw -w64-ucrt-x86_64-raylib make

    - name: Build raylib Library + Product
      run: |
        dir
        cd ${{ env.PROJECT_REPO_NAME }}
        make PLATFORM=Desktop BUILD_MODE=Release
      shell: msys2 {0}
