name: Build Project - WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_webassembly.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_webassembly.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}

    steps:
    - name: Checkout this repo
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}

    - name: Setup emsdk
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 5.0.3
        actions-cache-folder: 'emsdk-cache'

    - name: Setup Environment
      uses: msys2/setup-msys2@v2
      with:
        mysystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja make

    - name: Build Product
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}
        make build PLATFORM=Web BUILD_MODE=Release
      shell: msys2 {0}
