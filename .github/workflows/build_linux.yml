name: Build Project - Linux

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_linux.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_linux.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}

    steps:
    - name: Checkout this repo
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}

    - name: Setup Environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev ninja-build build-essential
      shell: bash

    - name: Build Product
      run: |
        gcc --version
        cd ${{ env.PROJECT_REPO_NAME }}
        make build PLATFORM=Desktop BUILD_TYPE=Release
      shell: bash
